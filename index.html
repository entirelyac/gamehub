<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imposter</title>
<style>
:root{--bg:#1b1426;--card:#2a2038;--line:#42345a;--text:#f5efe4;--mute:#a99bc0;--lemon:#ffd84a;--ink:#1b1426;--red:#ff4d6a;--ok:#6fe3b5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1426}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:20px 18px 40px}
h1,h2,.big{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;margin:0}
h1{font-size:2.6rem;line-height:1}
h2{font-size:1.5rem;margin-bottom:10px}
p{margin:6px 0;color:var(--mute)}
.sec{margin-top:26px}
.lbl{font-weight:600;margin-bottom:8px;display:block}
.row{display:flex;gap:8px;align-items:center}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
input[type=text],input[type=password],textarea{width:100%;background:var(--card);border:2px solid var(--line);border-radius:12px;color:var(--text);padding:12px 14px;font:inherit}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:13px 18px;font-weight:600;background:var(--card);color:var(--text);border:2px solid var(--line)}
button.pri{background:var(--lemon);color:var(--ink);border-color:var(--lemon);font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.15rem;width:100%;padding:16px}
button.pri:disabled{opacity:.4;cursor:not-allowed}
.chip{padding:9px 14px;border-radius:999px;font-size:.95rem}
.chip.on{background:var(--lemon);color:var(--ink);border-color:var(--lemon)}
.pl{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:6px}
.pl button{padding:4px 10px;border-radius:8px;background:transparent;border-color:transparent;color:var(--mute)}
.seg button{flex:1;padding:10px}
.seg button.on{background:var(--text);color:var(--ink);border-color:var(--text)}
.center{text-align:center;padding-top:8vh}
.big{font-size:3rem;line-height:1.05;word-break:break-word}
.stage{background:var(--card);border:2px dashed var(--line);border-radius:22px;padding:34px 18px;margin:22px 0;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;width:100%;color:var(--text);cursor:pointer}
.stage.imp{border-style:solid;border-color:var(--red);background:#3a1a2c}
.imp .big{color:var(--red)}
.timer{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:4.5rem;color:var(--lemon);margin:10px 0}
.timer.low{color:var(--red)}
.res{background:var(--card);border-radius:16px;padding:16px;margin:12px 0;text-align:left}
.red{color:var(--red)}
.score{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.gap{height:10px}
.grn{color:var(--ok)}
.eyes{font-size:1.1rem;margin-left:8px;opacity:.55;vertical-align:middle}
.res summary{cursor:pointer;font-weight:600}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.kp button{padding:14px;font-size:1.3rem}
.pwd{font-size:1.6rem;letter-spacing:3px;min-height:2.2rem;color:var(--lemon);margin-top:8px}
.bwrap{position:relative;max-width:480px;margin:12px auto}
.bwrap .cboard{margin:0}
.cm{position:absolute;inset:0;border-radius:10px;background:rgba(15,10,24,.74);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:12px;z-index:5}
.cmt{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2rem,10vw,3rem);color:#ffd84a;line-height:1.05}
.cms{font-size:1.3rem;font-weight:600}
.pb.rot{display:inline-block;transform:rotate(180deg)}
button{transition:transform .1s ease,filter .15s,background-color .2s,border-color .2s}
button:not(.link):not(:disabled):active{filter:brightness(1.25)}
@media (prefers-reduced-motion:no-preference){button:not(.link):not(:disabled):active{transform:scale(.95)}}
.sq:active{transform:none!important;filter:brightness(1.12)}
.kp .pri{padding:14px;font-size:1.1rem}
#pg{position:fixed;inset:0;z-index:40;background:#0b0a12;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#pg canvas{display:block;border-radius:6px;box-shadow:0 0 30px rgba(0,0,0,.6)}
.pbar{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3}
.pbar button{padding:6px 12px;font-size:1rem;border-radius:12px;background:rgba(20,16,32,.7);border-color:rgba(255,255,255,.25);color:#fff;min-width:44px}
.pctl{position:absolute;bottom:14px;display:flex;gap:10px;z-index:3}
.pctl.l{left:14px}
.pctl.r{right:14px}
.pctl button{width:62px;height:62px;border-radius:50%;padding:0;font-size:1.4rem;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55);color:#fff;touch-action:none}
.pctl button.fire{background:rgba(239,68,68,.5)}
.pctl button.down{background:rgba(255,255,255,.55);transform:scale(.92)}
.prot{display:none;position:absolute;inset:0;z-index:9;background:#0b0a12;color:#fff;align-items:center;justify-content:center;text-align:center;font-size:1.4rem;padding:30px}
#pg.port .prot{display:flex}
#pov{position:absolute;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(10,8,20,.7)}
#pov.on{display:flex}
.pcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px;min-width:260px;text-align:center;display:flex;flex-direction:column;gap:10px}
.toast{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:rgba(20,16,32,.92);color:#fff;padding:10px 16px;border-radius:12px;z-index:8;max-width:80%;text-align:center}
.panel2{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:16px;padding:14px;margin:16px 0}
.ov{position:fixed;inset:0;background:rgba(10,6,16,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.dlg{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px;max-width:360px;width:100%;text-align:center}
@keyframes ovin{from{opacity:0}to{opacity:1}}
@keyframes ovout{to{opacity:0}}
@keyframes dlgin{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes dlgout{to{opacity:0;transform:scale(.9)}}
.ev1{display:none}
.ev2{display:block;color:var(--red)}
.strk{background:linear-gradient(var(--red),var(--red)) no-repeat 0 55%/0 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
@keyframes strike{to{background-size:100% 4px}}
@keyframes out{to{opacity:0;transform:translateY(-6px)}}
.names{display:grid;gap:10px;margin-top:18px}
.nm{padding:16px;font-size:1.1rem}
.nm.done{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.fo{opacity:0;transform:translateY(-6px);transition:opacity .18s,transform .18s}
.cb{width:52px;height:52px;font-size:1.6rem;padding:0}
.cb:disabled{opacity:.35;cursor:not-allowed}
.sw{width:54px;height:32px;border-radius:999px;padding:3px;background:var(--line);border:0;flex:none;transition:background .18s}
.sw i{display:block;width:26px;height:26px;border-radius:50%;background:var(--text);transition:transform .18s}
.sw.on{background:var(--lemon)}
.sw.on i{transform:translateX(22px);background:var(--ink)}
.cat.h{background:transparent;color:var(--text);border:2px solid var(--red)}
.cat{display:inline-block;background:var(--lemon);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:1.4rem;padding:9px 22px;border-radius:999px;margin-top:6px}
@keyframes pop{from{opacity:0;transform:scale(.6);filter:blur(10px)}to{opacity:1;transform:none;filter:none}}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes soft{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){.rv1{animation:pop .7s .9s both}.rv2{animation:fade .6s 2.4s both}.soft{animation:soft .35s ease-out both}.evw{position:relative}.ev1{display:block;animation:pop .7s .9s both,out .4s 3.1s forwards}.strk{animation:strike .6s 2.1s both}.ev2{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:fade .6s 3.3s both}.rv2.late{animation-delay:4.3s}.ov{animation:ovin .2s both}.dlg{animation:dlgin .35s cubic-bezier(.2,1.5,.4,1) both}.ov.out{animation:ovout .2s both}.ov.out .dlg{animation:dlgout .2s both}.cm{animation:ovin .4s both}.cmt{animation:dlgin .55s cubic-bezier(.2,1.5,.4,1) .15s both}}
.sm{font-size:.9rem}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;padding:10px;width:100%}
@media (prefers-reduced-motion:no-preference){.stage{transition:transform .12s}.stage:active{transform:scale(.98)}}
.gcards{display:grid;gap:12px;margin-top:20px}
.gcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px;text-align:left;font-size:1.3rem;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800}
.gcard span{font-size:.9rem;color:var(--mute);font-weight:400;font-family:system-ui,sans-serif}
.wrapg{max-width:520px;margin:0 auto;padding:20px 18px 40px}
.cboard{display:grid;grid-template-columns:repeat(8,1fr);max-width:480px;margin:12px auto;border-radius:10px;overflow:hidden;border:2px solid var(--line)}
.sq{aspect-ratio:1;border:0;border-radius:0;padding:0;background:#a9784f;font-size:min(8.4vw,40px);line-height:1;display:flex;align-items:center;justify-content:center;position:relative}
.sq.l{background:#f0d9b5}
.sq.lm{background:#cdd26a!important}
.sq.ck{background:#e8604c!important}
.sq.sel{box-shadow:inset 0 0 0 4px var(--lemon)}
.sq.mv::after{content:"";width:30%;height:30%;border-radius:50%;background:rgba(27,20,38,.45);position:absolute}
.sq.mvc{box-shadow:inset 0 0 0 4px rgba(27,20,38,.5)}
.pw{color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000}
.pb{color:#150f1d}

function hideOv(){var o=document.getElementById("pov");if(o){o.className="";o.innerHTML="";}}
function setPause(on){PW.pause=on;var o=document.getElementById("pov");if(on){o.innerHTML='<div class="pcard"><h2>Paused</h2><button class="pri" data-pa="resume">Resume</button><button data-pa="restart">Restart match</button><button data-pa="quit">Quit to menu</button></div>';o.className="on";}else hideOv();}
function showOver(){PH.over=true;var o=document.getElementById("pov");o.innerHTML='<div class="pcard"><h2>Player '+(PW.win+1)+' wins!</h2><p>'+PW.wins[0]+' \u2013 '+PW.wins[1]+'</p><button class="pri" data-pa="rematch">Rematch</button><button data-pa="menu">Back to menu</button></div>';o.className="on";}
function toast(t){var d=document.createElement("div");d.className="toast";d.textContent=t;PH.d.appendChild(d);setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},3500);}
function pewFs(){var d=PH.d,fe=document.fullscreenElement||document.webkitFullscreenElement;if(fe){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}var r=d.requestFullscreen||d.webkitRequestFullscreen;if(!r){toast("Full screen isn\u2019t supported in this browser. On iPhone, use Share, then Add to Home Screen.");return;}try{var pr=r.call(d);if(pr&&pr.then)pr.then(function(){try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock("landscape").catch(function(){});}catch(x){}}).catch(function(){toast("Full screen was blocked by the browser.");});}catch(x){toast("Full screen isn\u2019t available here.");}}
function pgClick(e){var b=e.target.closest("button");if(!b)return;
 if(b.id==="ppause"||b.id==="pexit")setPause(true);
 else if(b.id==="pfs")pewFs();
 else if(b.dataset.pa==="resume")setPause(false);
 else if(b.dataset.pa==="restart")confirmBox("Restart the match?","Scores go back to 0.","Yes, restart","No, keep playing",function(){newMatch();PH.over=false;setPause(false);});
 else if(b.dataset.pa==="quit")confirmBox("Quit to menu?","The match will end.","Yes, quit","No, keep playing",stopPew);
 else if(b.dataset.pa==="rematch"){newMatch();PH.over=false;hideOv();}
 else if(b.dataset.pa==="menu")stopPew();}
function loop(t){if(!PH)return;var dt=Math.min(.033,(t-(PH.last||t))/1000);PH.last=t;var port=innerHeight>innerWidth;PH.d.classList.toggle("port",port);
 if(!PW.pause&&!port)step(dt);draw(PH.cv.getContext("2d"));if(PW.st==="over"&&!PH.over)showOver();PH.raf=window.requestAnimationFrame(loop);}
function startPew(){newMatch();var d=document.createElement("div");d.id="pg";
 var ctl=function(i){return '<button data-pk="'+i+':l" aria-label="Player '+(i+1)+' left">\u25c0</button><button data-pk="'+i+':r" aria-label="Player '+(i+1)+' right">\u25b6</button><button data-pk="'+i+':j" aria-label="Player '+(i+1)+' jump">\u25b2</button><button data-pk="'+i+':s" class="fire" aria-label="Player '+(i+1)+' shoot">\u25cf</button>';};
 d.innerHTML='<canvas id="pc" width="800" height="450"></canvas><div class="pbar"><button id="ppause" aria-label="Pause">\u275a\u275a</button><button id="pfs" aria-label="Full screen">\u26f6</button><button id="pexit" aria-label="Menu">\u2715</button></div><div class="pctl l">'+ctl(0)+'</div><div class="pctl r">'+ctl(1)+'</div><div class="prot">Turn your phone sideways to play</div><div id="pov"></div>';
 document.body.appendChild(d);PH={d:d,cv:d.querySelector("#pc"),held:{},raf:0,last:0,over:false};
 d.addEventListener("pointerdown",pdown);d.addEventListener("pointerup",pup);d.addEventListener("pointercancel",pup);d.addEventListener("click",pgClick);d.addEventListener("contextmenu",function(e){e.preventDefault();});
 document.addEventListener("keydown",kd);document.addEventListener("keyup",ku);window.addEventListener("resize",fit);window.addEventListener("orientationchange",fit);fit();PH.raf=window.requestAnimationFrame(loop);}
function stopPew(){if(!PH)return;window.cancelAnimationFrame(PH.raf);document.removeEventListener("keydown",kd);document.removeEventListener("keyup",ku);window.removeEventListener("resize",fit);window.removeEventListener("orientationchange",fit);var fe=document.fullscreenElement||document.webkitFullscreenElement;if(fe){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document);}catch(x){}}if(PH.d.parentNode)PH.d.parentNode.removeChild(PH.d);PH=null;PW=null;pewMenu();}
function endState(pos){var ms=legal(pos),w=pos.t==="w"?"Black":"White";K.endT="";K.endS="";
 if(!ms.length){if(inChk(pos,pos.t)){K.endT="Checkmate!";K.endS=w+" wins!";}else{K.endT="Stalemate!";K.endS=w+" wins \u2014 they trapped the king.";}return K.endT+" "+K.endS;}
 if(pos.hm>=100){K.endT="Draw";K.endS="50-move rule.";return K.endT+" "+K.endS;}
 var n=[];pos.b.forEach(function(x){if(x&&x.toUpperCase()!=="K")n.push(x.toUpperCase());});
 if(!n.length||(n.length===1&&(n[0]==="N"||n[0]==="B"))){K.endT="Draw";K.endS="Not enough pieces to checkmate.";return K.endT+" "+K.endS;}
 return "";}
})();
